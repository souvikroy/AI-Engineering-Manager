# Classification overlay for the 21-workflow ruleset.
# kind:     static | llm | hybrid
# severity: P0 (block+escalate) | P1 (block) | P2 (recommend) | P3 (nit)
# runner:   name of static module that emits this finding (only for static/hybrid)

_defaults:
  kind: llm
  severity: P2

