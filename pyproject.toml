[project]
name = "reviewer"
version = "0.2.0"
description = "AI code reviewer that applies a 21-workflow / ~200-rule production ruleset to GitHub repos via Qwen on OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "aiosqlite>=0.20",
    "gitpython>=3.1",
    "tree-sitter>=0.22",
    "tree-sitter-languages>=1.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tomli>=2.0",
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    # Auth
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "cryptography>=43",
    # Vector store
    "pinecone>=5.3",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
reviewer = "reviewer.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["reviewer*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
